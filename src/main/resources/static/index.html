<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quipux - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-slate-200 flex items-center justify-center min-h-screen p-4">

<div class="bg-cardBg p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700/50">
    <!-- Cabeçalho -->
    <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-blue-500 tracking-tight mb-2">Quipux API</h1>
        <p class="text-slate-400 text-sm">Acesse sua conta para obter o token de autenticação</p>
    </div>

    <!-- Formulário de Login -->
    <form id="loginForm" onsubmit="realizarLogin(event)" class="space-y-5">
        <div>
            <label for="loginInput" class="block text-slate-300 text-sm font-medium mb-2">Usuário</label>
            <input
                    type="text"
                    id="loginInput"
                    class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
                    placeholder="Digite seu login"
                    required>
        </div>

        <div>
            <label for="senhaInput" class="block text-slate-300 text-sm font-medium mb-2">Senha</label>
            <input
                    type="password"
                    id="senhaInput"
                    class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
                    placeholder="••••••••"
                    required>
        </div>

        <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-lg shadow-blue-600/30 active:scale-[0.99]">
            Autenticar
        </button>
    </form>

    <!-- Link para Cadastro -->
    <div class="mt-6 text-center text-sm text-slate-400">
        Não tem uma conta?
        <a href="cadastro.html" class="text-blue-400 hover:text-blue-300 font-semibold underline underline-offset-4 transition">
            Cadastre-se aqui
        </a>
    </div>

    <!-- Área de Resultado / Feedback -->
    <div id="resultado" class="mt-6 p-4 rounded-lg hidden transition-all duration-300 border"></div>
</div>

<script>
    async function realizarLogin(event) {
        event.preventDefault();

        const login = document.getElementById('loginInput').value;
        const senha = document.getElementById('senhaInput').value;
        const elementoResultado = document.getElementById('resultado');

        elementoResultado.className = 'mt-6 p-4 rounded-lg bg-slate-900 border-slate-700 text-slate-300 text-center text-sm block';
        elementoResultado.innerHTML = 'Autenticando...';

        try {
            const response = await fetch('/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login: login, senha: senha })
            });

            const data = await response.json();

            if (response.ok) {
                elementoResultado.className = 'mt-6 p-4 rounded-lg bg-emerald-950/60 border-emerald-800/60 text-emerald-300 text-sm block space-y-3';
                elementoResultado.innerHTML = `
                    <div class="flex items-center space-x-2 font-semibold text-emerald-400">
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                        <span>Autenticado com sucesso!</span>
                    </div>
                    <p class="text-xs text-emerald-200">Copie o token abaixo e utilize no nosso Swagger:</p>
                    <div class="bg-slate-900 p-2.5 rounded border border-slate-700/80 font-mono text-xs break-all text-slate-300 max-h-24 overflow-y-auto select-all">
                        ${data.token}
                    </div>
                    <div class="pt-1">
                        <a href="/swagger-ui/index.html" target="_blank" class="inline-flex items-center justify-center w-full px-3 py-2 text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-500 rounded transition duration-200">
                            Abrir Swagger UI
                            <svg class="w-4 h-4 ml-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        </a>
                    </div>
                `;
            } else {
                elementoResultado.className = 'mt-6 p-4 rounded-lg bg-rose-950/60 border-rose-800/60 text-rose-300 text-sm block';
                elementoResultado.innerHTML = `<strong>Erro:</strong> ${data.message || 'Credenciais inválidas'}`;
            }
        } catch (error) {
            elementoResultado.className = 'mt-6 p-4 rounded-lg bg-rose-950/60 border-rose-800/60 text-rose-300 text-sm block';
            elementoResultado.innerHTML = `<strong>Erro de Conexão:</strong> Não foi possível comunicar com o backend.`;
        }
    }
</script>
</body>
</html>
